<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-Home Radar</title>
<style>
  :root{--bg:#050b09;--card:#0b1612;--fg:#d8ffe9;--mut:#6f9c86;--g:#27ff8a;--r:#ff3d5a;--y:#ffc233;--b:#38b6ff}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
  header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid #12301f}
  h1{font-size:17px;margin:0;letter-spacing:.5px}.mut{color:var(--mut);font-size:12px}
  main{display:grid;grid-template-columns:minmax(320px,1fr) 340px;gap:14px;padding:14px;max-width:1300px;margin:auto}
  @media(max-width:900px){main{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid #12301f;border-radius:12px;padding:14px}
  #radar{width:100%;aspect-ratio:1/1;display:block;border-radius:50%;background:#030806}
  .pill{padding:4px 12px;border-radius:99px;font-weight:700;font-size:12px}
  .IDLE{background:#0f2f1d;color:var(--g)}.MOTION{background:#4a1220;color:var(--r)}
  .COOLDOWN{background:#41330f;color:var(--y)}.CALIBRATING,.SENSOR_LOST{background:#10304a;color:var(--b)}
  .big{font-size:30px;font-weight:700}.row{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
  button,select{background:#0f2a1c;color:var(--fg);border:1px solid #1e5a3a;border-radius:8px;padding:6px 10px;cursor:pointer}
  table{width:100%;border-collapse:collapse;font-size:12px}td,th{text-align:left;padding:5px;border-bottom:1px solid #12301f}
  canvas#sig{width:100%;height:90px;display:block}
  .bar{height:8px;background:#102a1c;border-radius:5px;overflow:hidden}.bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--y),var(--r))}
  .note{font-size:11px;color:var(--mut);line-height:1.5}
</style>
</head>
<body>
<header>
  <h1>📡 E-Home Radar <span class="mut">wireless motion map</span></h1>
  <div><span id="state" class="pill CALIBRATING">…</span>
  <select id="profile"><option>low</option><option selected>medium</option><option>high</option></select>
  <button id="cal">Recalibrate</button></div>
</header>
<main>
  <div class="card"><canvas id="radar" width="900" height="900"></canvas></div>
  <div>
    <div class="card">
      <div class="row"><span class="mut">Position estimate</span><span id="conf" class="mut"></span></div>
      <div class="big" id="pos">—</div>
      <div class="mut" id="posnote">no motion</div>
      <div class="row" style="margin-top:10px"><span class="mut">Motion score</span><span id="score">0</span></div>
      <div class="bar"><div id="bar"></div></div>
    </div>
    <div class="card" style="margin-top:14px"><div class="mut">Signal (primary link)</div><canvas id="sig" width="600" height="90"></canvas>
      <div class="mut" id="sensor"></div></div>
    <div class="card" style="margin-top:14px"><div class="mut">Recent events</div>
      <table><tbody id="ev"></tbody></table></div>
    <div class="card note" style="margin-top:14px" id="acc"></div>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
let R=null,sig=[],trail=[],ang=0,last=performance.now();
const cv=$('radar'),g=cv.getContext('2d');
function w2c(x,y,b,S){return[(x-b[0])/(b[1]-b[0])*S,S-(y-b[2])/(b[3]-b[2])*S]}
function heatColor(v){const a=Math.min(1,v);return `rgba(${Math.round(255*Math.min(1,a*2))},${Math.round(255*(a<.5?1:2-2*a))},60,${.15+.7*a})`}
function draw(now){
  const S=cv.width,c=S/2;ang=(ang+(now-last)*0.0012)%(Math.PI*2);last=now;
  g.clearRect(0,0,S,S);g.save();g.beginPath();g.arc(c,c,c-2,0,7);g.clip();
  g.fillStyle='#030806';g.fillRect(0,0,S,S);
  const b=R?R.bounds:[-5,5,-5,5];
  // heat map cells
  if(R){const n=R.n,cs=S/n;for(let j=0;j<n;j++)for(let i=0;i<n;i++){const v=R.grid[j][i];if(v>0.12){g.fillStyle=heatColor(v);g.fillRect(i*cs,S-(j+1)*cs,cs+1,cs+1)}}}
  // rings every metre + axes
  g.strokeStyle='rgba(39,255,138,.22)';g.lineWidth=1;g.fillStyle='rgba(111,156,134,.8)';g.font='18px system-ui';
  const [ox,oy]=w2c(0,0,b,S),pm=S/(b[1]-b[0]);
  for(let r=1;r<=Math.ceil((b[1]-b[0])/2*1.45);r++){g.beginPath();g.arc(ox,oy,r*pm,0,7);g.stroke();if(r<6)g.fillText(r+'m',ox+r*pm*.707+4,oy-r*pm*.707)}
  g.beginPath();g.moveTo(0,oy);g.lineTo(S,oy);g.moveTo(ox,0);g.lineTo(ox,S);g.stroke();
  // links
  if(R)R.links.forEach(l=>{const[a1,a2]=w2c(l.tx[0],l.tx[1],b,S),[b1,b2]=w2c(l.rx[0],l.rx[1],b,S);
    const k=Math.min(1,l.z/6);g.strokeStyle=k>.05?`rgba(255,61,90,${.25+.6*k})`:'rgba(56,182,255,.25)';g.lineWidth=k>.05?3:1.5;g.setLineDash(k>.05?[]:[8,8]);
    g.beginPath();g.moveTo(a1,a2);g.lineTo(b1,b2);g.stroke();g.setLineDash([]);
    [[a1,a2],[b1,b2]].forEach(([x,y])=>{g.fillStyle='#38b6ff';g.beginPath();g.arc(x,y,7,0,7);g.fill()})});
  // sweep
  const grad=g.createConicGradient(ang-1.1,c,c);grad.addColorStop(0,'rgba(39,255,138,0)');grad.addColorStop(.17,'rgba(39,255,138,.28)');grad.addColorStop(.1750,'rgba(39,255,138,0)');
  g.fillStyle=grad;g.beginPath();g.moveTo(c,c);g.arc(c,c,c,0,7);g.fill();
  g.strokeStyle='rgba(39,255,138,.8)';g.lineWidth=2;g.beginPath();g.moveTo(c,c);g.lineTo(c+Math.cos(ang)*c,c+Math.sin(ang)*c);g.stroke();
  // trail + target
  trail.forEach((p,i)=>{const[x,y]=w2c(p.x,p.y,b,S);g.fillStyle=`rgba(255,61,90,${i/trail.length*.5})`;g.beginPath();g.arc(x,y,6,0,7);g.fill()});
  if(R&&R.estimate){const e=R.estimate,[x,y]=w2c(e.x,e.y,b,S),rr=e.radius*pm,pulse=(now%1200)/1200;
    g.strokeStyle='rgba(255,61,90,.9)';g.lineWidth=3;g.beginPath();g.arc(x,y,Math.max(rr,14),0,7);g.stroke();
    g.strokeStyle=`rgba(255,61,90,${1-pulse})`;g.beginPath();g.arc(x,y,Math.max(rr,14)+pulse*50,0,7);g.stroke();
    g.fillStyle='#ff3d5a';g.beginPath();g.arc(x,y,9,0,7);g.fill()}
  g.restore();g.strokeStyle='#1e5a3a';g.lineWidth=4;g.beginPath();g.arc(c,c,c-2,0,7);g.stroke();
  requestAnimationFrame(draw)}
function drawSig(){const c=$('sig'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);if(sig.length<2)return;
  const lo=Math.min(...sig.map(d=>d.filtered))-1,hi=Math.max(...sig.map(d=>d.filtered))+1;
  x.strokeStyle='#27ff8a';x.beginPath();sig.forEach((d,i)=>{const px=i/(299)*c.width,py=c.height-(d.filtered-lo)/(hi-lo)*c.height*.9-4;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}
function onRadar(d){R=d;const e=d.estimate;
  if(e){trail.push(e);if(trail.length>25)trail.shift();$('pos').textContent=`x ${e.x} m · y ${e.y} m`;
    $('conf').textContent='confidence '+Math.round(e.confidence*100)+'%';
    $('posnote').textContent=e.links>1?`${e.links} links agree · ±${e.radius} m`:'single link: location is only along the link zone (no bearing)'}
  else{trail=[];$('pos').textContent='—';$('conf').textContent='';$('posnote').textContent='no motion'}
  const nl=d.links.length;$('acc').textContent=nl>1?`${nl} links active. Accuracy improves with more spread-out links/nodes.`:
   'Only 1 Wi-Fi link is configured, so the radar shows the zone where motion occurs, not its direction. Add ESP32 nodes (see docs) and list them under radar.links for true position.'}
function onReading(d){sig.push(d);if(sig.length>300)sig.shift();$('score').textContent=d.score.toFixed(0);$('bar').style.width=d.score+'%';
  $('state').textContent=d.state;$('state').className='pill '+d.state;drawSig()}
async function refresh(){try{const s=await (await fetch('/api/status')).json();$('sensor').textContent=s.sensor+' · '+s.profile+' · samples '+s.samples;$('profile').value=s.profile;
  $('state').textContent=s.state;$('state').className='pill '+s.state;
  const r=await (await fetch('/api/radar')).json();if(r.grid)onRadar(r);
  const ev=await (await fetch('/api/events?limit=6')).json();
  $('ev').innerHTML=ev.map(e=>`<tr><td>${new Date(e.start*1000).toLocaleTimeString()}</td><td>${e.duration}s</td><td>peak ${e.peak}</td></tr>`).join('')||'<tr><td class=mut>none yet</td></tr>'}catch(e){}}
function connect(){const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  ws.onmessage=m=>{const d=JSON.parse(m.data);if(d.type==='hello'){sig=d.history.slice(-300);drawSig()}
   else if(d.type==='reading')onReading(d);else if(d.type==='radar')onRadar(d);else if(d.type==='event')refresh()};
  ws.onclose=()=>setTimeout(connect,2000)}
$('cal').onclick=()=>fetch('/api/calibrate',{method:'POST'});
$('profile').onchange=e=>fetch('/api/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:e.target.value})});
connect();refresh();setInterval(refresh,4000);requestAnimationFrame(draw);
</script>
</body>
</html>
